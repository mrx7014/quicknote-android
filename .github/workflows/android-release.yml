name: Android release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - id: signing
        name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'Signing secrets are not configured; building an unsigned release APK for CI validation.'
            exit 0
          fi
          test -n "$ANDROID_KEYSTORE_PASSWORD" -a -n "$ANDROID_KEY_ALIAS" -a -n "$ANDROID_KEY_PASSWORD" || { echo 'Incomplete Android signing secrets'; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quicknote-release.jks"
          chmod 600 "$RUNNER_TEMP/quicknote-release.jks"
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - name: Run Android lint, unit tests, and release build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/quicknote-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleRelease
      - name: Verify signed release APK
        if: steps.signing.outputs.signed == 'true'
        run: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload signed APK artifact
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QuickNote-release-signed-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload unsigned APK artifact
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QuickNote-release-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-release.outputs.signed == 'true'
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: QuickNote-release-signed-${{ github.sha }}
          path: release-apk
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=release-apk/app-release.apk
          test -s "$APK"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --repo "$GITHUB_REPOSITORY" --title "QuickNote $GITHUB_REF_NAME" --notes "Signed release APK built from this tag."
          fi
